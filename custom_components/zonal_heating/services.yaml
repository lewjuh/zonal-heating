set_room_schedule:
  name: Set room schedule
  description: Set or update the heating schedule for a room
  fields:
    room_name:
      name: Room name
      description: Name of the room
      required: true
      example: "Living Room"
      selector:
        text:
    enabled:
      name: Enabled
      description: Whether the schedule is enabled
      required: false
      default: true
      selector:
        boolean:
    weekday:
      name: Weekday schedule
      description: List of weekday schedule points
      required: false
      example: '[{"time": "06:00", "temperature": 19.0}]'
      selector:
        object:
    weekend:
      name: Weekend schedule
      description: List of weekend schedule points
      required: false
      example: '[{"time": "08:00", "temperature": 19.0}]'
      selector:
        object:

get_room_schedule:
  name: Get room schedule
  description: Get the current schedule for a room
  fields:
    room_name:
      name: Room name
      description: Name of the room
      required: true
      example: "Living Room"
      selector:
        text:

delete_room_schedule:
  name: Delete room schedule
  description: Delete the schedule for a room
  fields:
    room_name:
      name: Room name
      description: Name of the room
      required: true
      selector:
        text:

add_schedule_point:
  name: Add schedule point
  description: Add a single schedule point to a room
  fields:
    room_name:
      name: Room name
      description: Name of the room
      required: true
      selector:
        text:
    timeline:
      name: Timeline
      description: Which timeline (weekday or weekend)
      required: true
      selector:
        select:
          options:
            - weekday
            - weekend
    time:
      name: Time
      description: Time for the schedule point (HH:MM format)
      required: true
      example: "06:00"
      selector:
        text:
    temperature:
      name: Temperature
      description: Target temperature
      required: true
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "C"

remove_schedule_point:
  name: Remove schedule point
  description: Remove a schedule point from a room
  fields:
    room_name:
      name: Room name
      description: Name of the room
      required: true
      selector:
        text:
    timeline:
      name: Timeline
      description: Which timeline (weekday or weekend)
      required: true
      selector:
        select:
          options:
            - weekday
            - weekend
    time:
      name: Time
      description: Time of the schedule point to remove (HH:MM format)
      required: true
      selector:
        text:
